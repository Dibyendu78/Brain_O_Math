<!DOCTYPE html>
<html lang="en">
<head>
{% load static %}
  <meta charset="UTF-8" />
  <title>Brain-O-Math Admin Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 15% 15%, rgba(37, 99, 235, 0.08), transparent 45%),
                  radial-gradient(circle at 85% 85%, rgba(79, 70, 229, 0.08), transparent 45%),
                  #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #f8fafc;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 1;
    }

    .login-container {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 3rem 2.5rem;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 420px;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .login-container h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .login-container h1 i {
      font-size: 1.8rem;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .form-group {
      margin-bottom: 1.5rem;
      text-align: left;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
      color: #94a3b8;
      letter-spacing: 0.02em;
    }

    label i {
      margin-right: 6px;
      color: #38bdf8;
    }

    input {
      width: 100%;
      padding: 0.85rem 1.1rem;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      font-size: 0.95rem;
      color: #ffffff;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    input::placeholder {
      color: #64748b;
    }

    input:focus {
      border-color: #38bdf8;
      outline: none;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
      background: rgba(15, 23, 42, 0.8);
    }

    .login-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      border: none;
      color: white;
      width: 100%;
      margin-top: 1rem;
      padding: 0.9rem 1.5rem;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
      background: linear-gradient(135deg, #1d4ed8, #4338ca);
    }
    
    .login-btn:active {
      transform: translateY(0);
    }

    .login-btn i { margin-right: 0.5rem; }

    .error-msg, .success-msg {
      margin-top: 1.25rem;
      font-weight: 600;
      font-size: 0.9rem;
      min-height: 20px;
    }
    .error-msg { color: #f87171; }
    .success-msg { color: #34d399; }
  </style>
</head>

<body>
  <div class="login-container">
    <h1><i class="fas fa-user-shield"></i> Admin Login</h1>

    <div class="form-group">
      <label for="username"><i class="fas fa-user-circle"></i> Username</label>
      <input type="text" id="username" placeholder="Enter username" autocomplete="username" required />
    </div>

    <div class="form-group">
      <label for="password"><i class="fas fa-key"></i> Password</label>
      <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required />
    </div>

    <button class="login-btn" onclick="handleLogin()">
      <i class="fas fa-sign-in-alt"></i> Login
    </button>

    <div id="loginMessage" class="error-msg"></div>
  </div>

  <script>
    const API = '/api/admin';
    const usernameEl = document.getElementById('username');
    const passwordEl = document.getElementById('password');
    const messageBox = document.getElementById('loginMessage');

    async function checkAuth() {
      const token = localStorage.getItem('bomAdminToken');
      if (!token) {
        return;
      }

      try {
        const res = await fetch(`${API}/stats`, {
          headers: {
            'Content-Type': 'application/json',
          },
          credentials: 'include',
        });
        if (res.ok) {
          window.location.href = '/admin-control/';
          return;
        }
      } catch (err) {
        console.error('Token validation failed', err);
      }

      localStorage.removeItem('bomAdminToken');
    }

    checkAuth();

    async function handleLogin() {
      const username = usernameEl.value.trim();
      const password = passwordEl.value.trim();
      messageBox.textContent = '';
      messageBox.className = 'error-msg';

      if (!username || !password) {
        messageBox.textContent = 'Please enter both username and password.';
        return;
      }

      try {
        const res = await fetch(`${API}/login`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
          messageBox.textContent = data.message || 'Invalid username or password.';
          return;
        }

        localStorage.setItem('bomAdminToken', data.token);

        const validateRes = await fetch(`${API}/stats`, {
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
        });
        if (!validateRes.ok) {
          messageBox.textContent = 'Login succeeded, but browser failed to save the authentication cookie. Please enable cookies and try again.';
          return;
        }

        messageBox.className = 'success-msg';
        messageBox.textContent = 'Login successful! Redirecting...';
        setTimeout(() => (window.location.href = '/admin-control/'), 700);
      } catch (err) {
        console.error('Login Error:', err);
        messageBox.textContent = 'Server unreachable. Please try again later.';
      }
    }
  </script>
</body>
</html>
